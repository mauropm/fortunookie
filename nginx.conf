# Fortune Cookie — Nginx config for a small VPS (1 vCPU / 1 GB RAM).
# Static-only: no upstream, no proxying. Serves /var/www/fortune-cookie.

server {
    listen 80;
    listen [::]:80;
    server_name fortunookie.example.com;

    root /var/www/fortune-cookie;
    index index.html;

    # --- Compression -------------------------------------------------------
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
    # If ngx_brotli is compiled in, also run:
    #   brotli on;
    #   brotli_types text/css application/javascript application/json image/svg+xml;

    # --- Security headers ---------------------------------------------------
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    # Keep in sync with the CSP <meta> tag in index.html.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; media-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;

    # --- Caching ------------------------------------------------------------
    # Hashed build assets: immutable, cache forever.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
    # Fortune + locale JSON: cacheable but revalidated (new locales ship safely).
    location ~* ^/(fortunes|locales)/.*\.json$ {
        add_header Cache-Control "public, max-age=3600, stale-while-revalidate=86400";
    }
    location /icons/ {
        add_header Cache-Control "public, max-age=86400";
    }
    # Service worker + HTML: always revalidate so deploys take effect.
    location = /sw.js {
        add_header Cache-Control "no-cache";
    }
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }

    # --- Misc ---------------------------------------------------------------
    location = /robots.txt {
        add_header Cache-Control "public, max-age=3600";
    }
    error_page 404 /index.html;
}
