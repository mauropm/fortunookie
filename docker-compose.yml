# Optional Docker Compose setup for the Fortune Cookie site.
# Static files served by unprivileged nginx — no app server, no database.
services:
  web:
    build: .
    image: fortune-cookie:latest
    ports:
      - "8080:8080"
    environment:
      NGINX_SERVER_NAME: fortunookie.example.com
    restart: unless-stopped
    # TLS termination: put Caddy or Nginx + certbot in front, or add your
    # certificates to a custom template. See README "Deploying" section.
