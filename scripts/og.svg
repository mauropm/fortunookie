  <text x="76" y="90" font-family="Georgia, 'Times New Roman', serif" font-size="40" font-weight="bold" fill="#43301f">Fortune Cookie</text>
  <text x="76" y="170" font-family="Georgia, 'Times New Roman', serif" font-size="56" font-weight="bold" fill="#43301f">What good fortune</text>
  <text x="76" y="235" font-family="Georgia, 'Times New Roman', serif" font-size="56" font-weight="bold" fill="#43301f">awaits you today?</text>
  <text x="76" y="300" font-family="Helvetica, Arial, sans-serif" font-size="26" fill="#7a6a55">A positive wish in your language — 30 languages, infinite cookies.</text>
  <text x="76" y="545" font-family="Helvetica, Arial, sans-serif" font-size="24" font-weight="bold" fill="#c98a1e">Crack your cookie — fortunookie.example.com</text>
